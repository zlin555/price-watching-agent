<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>看板 | PricePilot</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="app-page">
    <aside class="sidebar">
      <a class="brand" href="index.html" aria-label="PricePilot 首页">
        <span class="brand-mark">P</span>
        <span>PricePilot</span>
      </a>
      <nav class="side-nav" aria-label="内部导航">
        <button class="side-link active" type="button" data-view="board">价格看板</button>
        <button class="side-link" type="button" data-view="new-watch">新增追踪</button>
      </nav>
      <button class="ghost-button logout-button" type="button">退出登录</button>
    </aside>

    <main class="app-main">
      <header class="app-header">
        <div>
          <p class="panel-label">内部页面</p>
          <h1>价格追踪看板</h1>
        </div>
        <div class="user-menu">
          <button class="user-chip" type="button" id="user-menu-button" aria-expanded="false">
            <span class="avatar small" id="header-avatar">U</span>
            <span id="user-phone">未登录</span>
          </button>
          <section class="user-panel hidden" id="user-panel" aria-label="用户设置面板">
            <div class="user-panel-head">
              <span class="avatar panel-avatar" id="panel-avatar">U</span>
              <div>
                <p class="panel-label">User Panel</p>
                <h2 id="panel-phone">未登录</h2>
                <p class="muted"><span id="panel-watch-count">0</span> 个追踪任务 · <span id="panel-status">Active</span></p>
              </div>
            </div>

            <form class="panel-form" id="avatar-form">
              <label>
                <span>上传头像</span>
                <input id="avatar-upload" type="file" accept="image/*" />
              </label>
            </form>

            <form class="panel-form" id="settings-form">
              <label>
                <span>通知手机号</span>
                <input id="notification-phone" type="tel" />
              </label>
              <button class="submit-button compact-button" type="submit">保存手机号</button>
              <p class="form-message" id="settings-message"></p>
            </form>

            <form class="panel-form" id="password-form">
              <label>
                <span>当前密码</span>
                <input id="current-password" type="password" autocomplete="current-password" />
              </label>
              <label>
                <span>新密码</span>
                <input id="new-password" type="password" autocomplete="new-password" />
              </label>
              <button class="submit-button compact-button" type="submit">修改密码</button>
              <p class="form-message" id="password-message"></p>
            </form>
          </section>
        </div>
      </header>

      <section class="app-layout" data-view-panel="board">
        <section class="panel list-panel">
          <div class="section-heading">
            <div>
              <p class="panel-label">任务列表</p>
              <h2>选择一个追踪链接</h2>
            </div>
          </div>
          <ul class="watch-list interactive-list" id="watch-list"></ul>
        </section>

        <section class="panel trend-panel detail-panel">
          <div class="section-heading">
            <div>
              <p class="panel-label">详细价格波动</p>
              <h2 id="detail-title">请选择一个任务</h2>
            </div>
            <span class="status-pill" id="detail-status">等待选择</span>
          </div>
          <div class="chart large-chart" id="detail-chart" aria-label="详细价格趋势图"></div>
          <div class="trend-meta" id="detail-meta"></div>
          <button class="secondary-link refresh-button" id="refresh-watch" type="button">立即检索</button>
        </section>
      </section>

      <section class="panel add-watch-panel hidden" data-view-panel="new-watch">
        <div class="section-heading">
          <div>
            <p class="panel-label">新增任务</p>
            <h2>添加新的跟踪链接或股票代码</h2>
          </div>
        </div>
        <form class="watch-form compact-form" id="new-watch-form">
          <label>
            <span>任务名称</span>
            <input id="watch-title" type="text" value="新商品追踪" />
          </label>
          <label>
            <span>商品链接 / 旅行链接 / 股票代码</span>
            <input id="watch-target" type="text" value="https://example.com/product" />
          </label>
          <div class="form-grid">
            <label>
              <span>目标价格</span>
              <input id="watch-price" type="number" value="100" />
            </label>
            <label>
              <span>提醒方向</span>
              <select id="watch-direction">
                <option value="below">低于目标价提醒</option>
                <option value="above">高于目标价提醒</option>
                <option value="change">任意明显波动提醒</option>
              </select>
            </label>
          </div>
          <label>
            <span>自动检索间隔</span>
            <select id="watch-interval">
              <option value="15">每 15 分钟</option>
              <option value="30">每 30 分钟</option>
              <option value="60" selected>每 1 小时</option>
              <option value="360">每 6 小时</option>
              <option value="1440">每天</option>
            </select>
          </label>
          <button class="submit-button" type="submit">添加追踪任务</button>
          <p class="form-message" id="watch-message"></p>
        </form>
      </section>
    </main>

    <script src="dashboard.js"></script>
  </body>
</html>
